    <meta charset="UTF-8" />

    <meta name="description" content="Replay real historical markets bar by bar, backtest your setups, and share a live chart with your trading group." />
    <meta name="theme-color" content="#0B0D11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:site_name" content="Piptest" />
    <meta property="og:title" content="Piptest | Free Backtesting Software" />
    <meta property="og:description" content="Replay the markets. Together. Completely free. Replay real markets bar by bar, test your setups, and share a live chart with your trading group." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.piptest.com/" />
    <!-- absolute URLs: several scrapers will not resolve a relative path -->
    <meta property="og:image" content="https://www.piptest.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://www.piptest.com/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- was a CSS @import inside a JS-injected <style> tag (GLOBAL_CSS in
         ui.jsx) — that can't even start fetching until the JS bundle has
         downloaded, parsed and run, and @import is render-blocking on top
         of that. A real <link> here lets the browser's preload scanner
         kick this off immediately, in parallel with everything else,
         which is the whole point of the preconnect hints above. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  </head>

  </body>
