# Database lives on Supabase, not Render — Render's free Postgres is
# deleted 30 days after creation. See BACKEND.md.

services:
  # ---------- the website ----------
  - type: web
    name: piptest
    runtime: static
    # tv:install pulls TradingView's licensed Advanced Charts library in
    # before the build — it's gitignored on purpose (licensed, not ours to
    # commit; see TRADINGVIEW.md), so it has to be fetched fresh on every
    # deploy. Missing/bad TV_GH_TOKEN degrades to the chart's own "not
    # installed" placeholder rather than failing the whole build.
    buildCommand: npm ci && npm run tv:install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false        # https://api.piptest.com
      - key: TV_GH_TOKEN
        sync: false        # GitHub PAT for the account TradingView granted
                            # charting_library access to — see TRADINGVIEW.md §1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- the admin console ----------
  # Separate site on its own origin, so the code that lists every user
  # never ships to a visitor's browser. Gated on the admin role by the API.
  - type: web
    name: piptest-admin
    runtime: static
    # No rootDir: for a static site staticPublishPath is resolved from the
    # repo root, so setting both is what produces a "Not Found" page.
    buildCommand: cd admin && npm install && npm run build
    staticPublishPath: ./admin/dist
    envVars:
      - key: VITE_API_URL
        sync: false        # same API as the main site
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

  # ---------- the API ----------
  - type: web
    name: piptest-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false                  # Supabase session pooler string
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random value
      - key: ALLOWED_ORIGIN
        sync: false                  # https://piptest.com,https://www.piptest.com
      - key: ADMIN_EMAILS
        sync: false                  # your email — unlocks the admin dashboard
      - key: COOKIE_CROSS_SITE
        sync: false                  # "true" only if the API is NOT on piptest.com
      - key: COOKIE_DOMAIN
        sync: false                  # ".piptest.com" when using api.piptest.com
      - key: RESEND_API_KEY
        sync: false                  # from resend.com — enables reset emails
      - key: TWELVE_DATA_API_KEY
        sync: false                  # from twelvedata.com — enables forex & index-ETF candles
      - key: MAIL_FROM
        sync: false                  # Piptest <noreply@send.piptest.com>
      - key: MAIL_REPLY_TO
        sync: false                  # info@piptest.com — where replies land
      - key: APP_URL
        sync: false                  # https://piptest.com — where reset links point
      - key: NODE_ENV
        value: production
