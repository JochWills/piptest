# Database lives on Supabase, not Render — Render's free Postgres is
# deleted 30 days after creation. See BACKEND.md.

services:
  # ---------- the website ----------
  - type: web
    name: piptest
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false        # https://api.piptest.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- the API ----------
  - type: web
    name: piptest-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false                  # Supabase session pooler string
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random value
      - key: ALLOWED_ORIGIN
        sync: false                  # https://piptest.com,https://www.piptest.com
      - key: ADMIN_EMAILS
        sync: false                  # your email — unlocks the admin dashboard
      - key: COOKIE_CROSS_SITE
        sync: false                  # "true" only if the API is NOT on piptest.com
      - key: COOKIE_DOMAIN
        sync: false                  # ".piptest.com" when using api.piptest.com
      - key: NODE_ENV
        value: production
