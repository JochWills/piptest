services:
  - type: web
    name: piptest
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false        # set to your sync service URL to enable live rooms
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: piptest-sync
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ALLOWED_ORIGIN
        sync: false        # set to https://yourdomain.com
