# Supabase pauses a free project after 7 days with no database activity,
# and Render spins a free web service down after 15 minutes idle.
#
# This pings /healthz every 3 days. That endpoint runs `SELECT 1`, so a
# single request wakes the API *and* touches the database — which is
# exactly what both platforms count as activity.
#
# Set the API_URL repository variable:
#   GitHub → Settings → Secrets and variables → Actions → Variables
#   API_URL = https://api.piptest.com

name: Keep alive

on:
  schedule:
    - cron: "17 6 */3 * *"     # every 3 days, 06:17 UTC
  workflow_dispatch:            # and on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API and touch the database
        run: |
          URL="${{ vars.API_URL }}"
          if [ -z "$URL" ]; then
            echo "API_URL variable is not set — skipping."
            exit 0
          fi
          echo "Pinging $URL/healthz"
          # a cold Render instance takes ~60s to boot, so allow for it
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 90 "$URL/healthz" || echo 000)
            echo "attempt $i -> HTTP $code"
            cat /tmp/out.txt || true
            echo
            if [ "$code" = "200" ]; then
              echo "Awake, database reachable."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Health check never returned 200 — check the API and Supabase."
          exit 1
